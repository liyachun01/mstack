# Prepared only; activate only after approval of docs/WINDMILL-SHARED-PG-PROPOSAL.md.
# Explicit standalone project; does not create or manage the shared PostgreSQL service.
name: mcp-stack-windmill

x-logging: &logging
  driver: json-file
  options: {max-size: "5m", max-file: "2"}

x-windmill: &windmill
  image: ghcr.io/windmill-labs/windmill:1.823.1@sha256:20932690bab6b1820bba7a4b5934998ec69fa3f82c0ddd9a500114e53ef51f50
  platform: linux/arm64
  pull_policy: never
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging: *logging
  volumes:
    - worker_logs:/tmp/windmill/logs

services:
  server:
    <<: *windmill
    container_name: mcp-stack-windmill-server
    cpus: 0.5
    mem_limit: 768m
    environment:
      MODE: server
      DATABASE_URL: ${WM_DATABASE_URL:?Use the approved shared-PG env file}
      BASE_URL: http://127.0.0.1:58090
    ports: ["127.0.0.1:58090:8000"]
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent --max-time 5 http://127.0.0.1:8000/api/version >/dev/null"]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 90s

  worker:
    <<: *windmill
    container_name: mcp-stack-windmill-worker
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 512
    privileged: false
    environment:
      MODE: worker
      WORKER_GROUP: default
      NUM_WORKERS: "1"
      DATABASE_URL: ${WM_DATABASE_URL:?Use the approved shared-PG env file}
      DISABLE_NSJAIL: "true"
      ENABLE_UNSHARE_PID: "false"
      FAVOR_UNSHARE_PID: "false"
    volumes:
      - worker_cache:/tmp/windmill/cache
      - worker_logs:/tmp/windmill/logs

volumes:
  worker_cache: {name: mcp-stack-windmill-worker-cache}
  worker_logs: {name: mcp-stack-windmill-worker-logs}

networks:
  default:
    external: true
    name: mcp-stack-memory
